id: ss-famclaw-env-secrets
kind: pattern
scanner: skillsafety
category: env_secret_exposure
severity: HIGH
message: env_allowlist contains secret-like variable name — potential exfiltration
signal: override_phrase
patterns:
  - regex: '(?i)env_allowlist:\s*\[[^\]]*(API_KEY|SECRET|TOKEN|PASSWORD|PRIVATE_KEY)[^\]]*\]'
    description: env_allowlist contains secret-like name