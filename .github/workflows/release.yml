name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@v3

      - uses: anchore/sbom-action/download-syft@v0

      # Self-check: run the production gate helper against this repository.
      - name: HoneyBadger self-check
        run: |
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags "-s -w" -o /tmp/honeybadger-selfcheck ./cmd/honeybadger
          scripts/release-gate.sh /tmp/honeybadger-selfcheck . /tmp/self-report.json

      # GoReleaser: build, sign, Docker, SBOM, release
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_YES: "true"

      # Replace GoReleaser's generated notes with the reviewed, authored release body.
      - name: Set authored release notes
        run: gh release edit "${{ github.ref_name }}" --notes-file RELEASE_NOTES.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# Attest build provenance for the release checksums file
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/SHA256SUMS

      # Attest SBOM files
      - name: Attest SBOMs
        run: |
          for f in dist/*.spdx.json; do
            [ -f "$f" ] || continue
            echo "Attesting SBOM: $f"
            if ! gh attestation create "$f" --repo "${{ github.repository }}"; then
              echo "::warning::SBOM attestation failed for $f"
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Upload self-check report to release
      - name: Upload extra artifacts
        if: always()
        run: |
          if [ -f /tmp/self-report.json ]; then
            gh release upload "${{ github.ref_name }}" /tmp/self-report.json --clobber
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
